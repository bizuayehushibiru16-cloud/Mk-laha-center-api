<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ማኅበረ ቅዱሳን ላሃ ወረዳ — Member System</title>
<style>
:root{--blue:#1a3a8f;--blue2:#12296b;--gold:#d4a017;--gold2:#f5e199;--bg:#f4f6fb;--tx:#1b2033;--card:#fff;--bd:#d9deeb;--red:#c0392b;--green:#1e8449}
@media(prefers-color-scheme:dark){:root{--bg:#0e1326;--tx:#e8ebf5;--card:#171e38;--bd:#2c3558}}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Ethiopic',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 12px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.15rem}header p{margin:2px 0 0;font-size:.8rem;color:var(--gold2)}
nav{display:flex;position:sticky;top:0;z-index:5;background:var(--blue2)}
nav button{flex:1;padding:12px;border:0;background:none;color:#fff;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:var(--gold);color:var(--gold2);font-weight:700}
main{max-width:980px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.05rem;color:var(--blue);border-bottom:2px solid var(--gold);padding-bottom:6px}
@media(prefers-color-scheme:dark){.card h2{color:var(--gold2)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:2px}
label small{font-weight:400;opacity:.7}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#222}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:.8rem}.btn.gray{background:#6b7390}
